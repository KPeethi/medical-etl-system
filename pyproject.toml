[project]
name = "enhanced-medical-organizer"
version = "1.0.0"
description = "Enhanced medical file organizer with PDF content reading and patient matching"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "gunicorn>=23.0.0",
    "jsonschema>=4.25.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "py7zr>=1.0.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "werkzeug>=3.1.3",
    "PyPDF2>=3.0.0",
    "reportlab>=4.0.0",
]
